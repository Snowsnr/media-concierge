services:
  api:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace @media-concierge/api"
    volumes:
      - ../../:/workspace
      - api_modules:/workspace/node_modules
      - concierge_data:/workspace/data
    ports:
      - '4100:4100'
    environment:
      CONCIERGE_API_PORT: 4100
      CONCIERGE_DB_PATH: /workspace/data/media-concierge.db

  portal:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace @media-concierge/portal -- --host 0.0.0.0"
    volumes:
      - ../../:/workspace
      - portal_modules:/workspace/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_CONCIERGE_API_URL: http://localhost:4100
    depends_on:
      - api

  admin:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace @media-concierge/admin -- --host 0.0.0.0"
    volumes:
      - ../../:/workspace
      - admin_modules:/workspace/node_modules
    ports:
      - '5174:5174'
    environment:
      VITE_CONCIERGE_API_URL: http://localhost:4100
    depends_on:
      - api

volumes:
  api_modules:
  portal_modules:
  admin_modules:
  concierge_data:
